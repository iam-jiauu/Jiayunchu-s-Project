<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="About: every day you wrote this year, collected into one year calendar." />
<title>About · 2026 Planner</title>
<link rel="icon" type="image/jpeg" href="assets/favicon.jpg" />
<link rel="apple-touch-icon" href="assets/app-icon.jpg" />
<link rel="stylesheet" href="style.css" />
</head>
<body class="ppt-body abt-body">

<img id="petSource" src="assets/pet.png" alt="" hidden />

<main class="ppt-stage" id="stage">

  <!-- ===== 顶部导航 ===== -->
  <nav class="topnav" aria-label="Page navigation">
    <span class="topnav__brand">2026 Planner</span>
    <div class="topnav__links">
      <a class="topnav__link" href="index.html">Home</a>
      <a class="topnav__link" href="months.html">Months</a>
      <a class="topnav__link" href="calendar.html">Calendar</a>
      <a class="topnav__link is-active" href="about.html">About</a>
      <button class="topnav__link topnav__link--btn" id="openSettings" type="button">Settings</button>
    </div>
  </nav>

  <!-- ===== 牛皮纸双开活页本 ===== -->
  <div class="binder">
    <div class="binder__spine" aria-hidden="true">
      <span class="binder__ring"></span>
      <span class="binder__ring"></span>
      <span class="binder__ring"></span>
      <span class="binder__ring"></span>
      <span class="binder__ring"></span>
      <span class="binder__ring"></span>
      <span class="binder__ring"></span>
    </div>

    <!-- 左页：年度日历 -->
    <section class="binder__page binder__page--left">
      <div class="binder__inner ba-inner">
        <h1 class="ba-title">My Year</h1>
        <p class="ba-sub">days with notes light up · tap one</p>
        <div class="year-cal" id="yearCal" aria-label="2026 year calendar"></div>
      </div>
    </section>

    <!-- 右页：当天手账 -->
    <section class="binder__page binder__page--right">
      <div class="binder__inner ba-inner">
        <h2 class="ba-jtitle">Journal</h2>
        <p class="ba-jdate" id="journalDate">pick a day to open that page</p>
        <div class="ba-journal" id="journalList" aria-live="polite">
          <p class="abt-empty">Any lit box on the left<br />is a day you wrote this year.</p>
        </div>
        <p class="ba-stat" id="journalStat"></p>
      </div>
    </section>
  </div>

</main>

<button class="fs-btn" id="fullscreenBtn" type="button" aria-label="Fullscreen">⤢</button>

<script src="site.js"></script>
</body>
</html>
